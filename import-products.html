        async function uploadAllProducts() {
            const statusDiv = document.getElementById('status');
            statusDiv.classList.remove('hidden');
            statusDiv.innerHTML = `
                <div class="flex items-center justify-center gap-3">
                    <i class="fas fa-spinner fa-spin text-2xl text-[#C69C6D]"></i>
                    <span class="font-bold">جاري رفع المنتجات... (0/${productsToUpload.length})</span>
                </div>
            `;

            let successCount = 0;
            let errorCount = 0;

            for (let i = 0; i < productsToUpload.length; i++) {
                const product = productsToUpload[i];
                
                try {
                    // Remove the numeric id since Firestore will generate its own
                    const { id, ...productData } = product;
                    
                    await db.collection("products").add(productData);
                    successCount++;
                    
                    // Update status every 5 products
                    if ((i + 1) % 5 === 0 || i === productsToUpload.length - 1) {
                        statusDiv.innerHTML = `
                            <div class="flex items-center justify-center gap-3">
                                <i class="fas fa-spinner fa-spin text-2xl text-[#C69C6D]"></i>
                                <span class="font-bold">جاري الرفع... (${successCount}/${productsToUpload.length})</span>
                            </div>
                        `;
                    }
                } catch (error) {
                    console.error("Error uploading product:", product.name, error);
                    errorCount++;
                }
            }

            // Final status
            if (errorCount === 0) {
                statusDiv.innerHTML = `
                    <div class="text-center">
                        <i class="fas fa-check-circle text-4xl text-green-500 mb-3"></i>
                        <p class="font-bold text-lg text-green-600">تم رفع ${successCount} منتج بنجاح! 🎉</p>
                        <p class="text-sm mt-2">افتحي لوحة التحكم الآن.</p>
                    </div>
                `;
            } else {
                statusDiv.innerHTML = `
                    <div class="text-center">
                        <i class="fas fa-exclamation-triangle text-4xl text-orange-500 mb-3"></i>
                        <p class="font-bold">تم رفع ${successCount} منتج</p>
                        <p class="text-red-600">فشل رفع ${errorCount} منتج</p>
                    </div>
                `;
            }
        }
    </script>
